<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
        
       .btn1 {
            padding: 10px 20px;
            background: linear-gradient(45deg, #3498db, #8e44ad);
            border: none;
            border-radius: 4px;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
        }
        .btn1:hover { background-color: #2980b9; }

        .btn2 {
            padding: 10px 20px;
            background-color: #2ecc71;
            border: 2px solid #27ae60;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }
        .btn2:hover { background-color: #27ae60; }

        .btn3 {
            padding: 10px 20px;
            background-color: #e74c3c;
            border: 3px #c0392b;
            border-radius: 50px;        
            color: white;
            cursor: pointer;
        }
        .btn3:hover { background-color: #c0392b; }

        .btn4 {
            padding: 10px 20px;
            background-color: #9b59b6;
            border: 2px solid transparent;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        .btn4:hover { background-color: #8e44ad; }

        .btn5 {
            padding: 10px 20px;
            background-color: #34495e;
            border: 2px solid #2c3e50;
            border-radius: 12px;
            color: #ecf0f1;
            cursor: pointer;
        }
        .btn5:hover { background-color: #2c3e50; }

        .btn6 {
            padding: 10px 20px;
            background-color: transparent;
            border: 2px solid #e67e22;
            border-radius: 6px;
            color: #e67e22;
            cursor: pointer;
        }
        .btn6:hover { 
            background-color: #e67e22; 
            color: white; 
        }

        .btn7 {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid #d35400;
            border-radius: 30px;
            color: #2c3e50;
            cursor: pointer;
            box-shadow: 0px 4px 8px #2c3e50;
            transition: transform 1.1s ;
        }
        .btn7:hover { background-color: #f39c12; }
        .btn7:active{
            transform:scale(105) rotate(1200deg);
            background-color: #8a5a0d;
        }
        .btn8 {
            padding: 10px 20px;
            background-color: transparent;
            border: 2px solid #22e622;
            border-radius: 6px;
            color: #e622a5;
            cursor: pointer;
        }
        .btn6:hover { 
            background-color: #e6e322; 
            color: white; 
        }
            </style>
    <title>Document</title>
    

</head>
<body>
    <button class="btn1" id="botao-principal">1</button>
    <button class="btn2" id="botao-principal">2</button>
    <button class="btn3" id="botao-principal">3</button>
    <button class="btn4" id="botao-principal">4</button>
    <button class="btn5" id="botao-principal">5</button>
    <button class="btn6" id="botao-principal">6</button>
    <button class="btn7" id="botao-principal">7</button>
    <button class="btn8" id="botao-principal">8</button>
    

</body>
</html>
