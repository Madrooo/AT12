<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
        body{
            background-color: purple;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .btn7 {
            background-image: url("img/radiohead.png");
            background-size: cover;
            background-position: center;
            background-color: #47073f;

            padding: 10px 20px;
            border: 1px solid #ce39ba;
            border-radius: 30px;
            color: #180313;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0px 4px 8px #080808;
            transition: transform 1.1s;
        }

        .btn7:hover {
            background-image: url("img/radiohead.gif");
        }

        .btn7:active {
            transform: scale(105) rotate(1200deg);
        }
    </style>
    <title>Document</title>
</head>
<body>
    <form>
        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>
        </div>

        <div>
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <div>
            <button class="btn7" id="botao-principal" type="submit">
                Entrar
            </button>
        </div>
    </form>
</body>
</html>
